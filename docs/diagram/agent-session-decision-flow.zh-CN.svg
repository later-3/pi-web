<svg viewBox="0 0 1000 1160" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 11px; }
    .node-title { fill: #f8fafc; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .node-sub { fill: #94a3b8; font-size: 10px; text-anchor: middle; }
    .edge-label { font-size: 10px; font-weight: 600; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Connections -->
  <path d="M500 136 L500 180" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M500 270 L500 330" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M575 225 L760 225 L760 280" stroke="#fb7185" stroke-width="1.8" fill="none" marker-end="url(#arrow-rose)"/>
  <path d="M500 420 L500 495" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M430 375 L215 375 L215 460" stroke="#fbbf24" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M570 375 L785 375 L785 460" stroke="#fb7185" stroke-width="1.8" fill="none" marker-end="url(#arrow-rose)"/>
  <path d="M215 530 L215 570 L430 570" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M785 530 L785 570 L570 570" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 585 L500 650" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M425 700 L190 700 L190 770" stroke="#34d399" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 745 L500 770" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M575 700 L810 700 L810 770" stroke="#a78bfa" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M190 850 L190 895 L420 895" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 850 L500 885" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M810 850 L810 895 L580 895" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 955 L500 1010" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>

  <!-- Opaque masks -->
  <rect x="370" y="76" width="260" height="60" rx="30" fill="#0f172a"/>
  <polygon points="500,180 575,225 500,270 425,225" fill="#0f172a"/>
  <rect x="660" y="280" width="200" height="78" rx="8" fill="#0f172a"/>
  <polygon points="500,330 570,375 500,420 430,375" fill="#0f172a"/>
  <rect x="105" y="460" width="220" height="70" rx="8" fill="#0f172a"/>
  <rect x="675" y="460" width="220" height="70" rx="8" fill="#0f172a"/>
  <rect x="390" y="495" width="220" height="90" rx="8" fill="#0f172a"/>
  <polygon points="500,650 575,700 500,750 425,700" fill="#0f172a"/>
  <rect x="75" y="770" width="230" height="80" rx="8" fill="#0f172a"/>
  <rect x="385" y="770" width="230" height="80" rx="8" fill="#0f172a"/>
  <rect x="695" y="770" width="230" height="80" rx="8" fill="#0f172a"/>
  <rect x="365" y="885" width="270" height="70" rx="8" fill="#0f172a"/>
  <rect x="350" y="1010" width="300" height="72" rx="36" fill="#0f172a"/>

  <!-- Nodes -->
  <rect x="370" y="76" width="260" height="60" rx="30" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="500" y="102" class="node-title">收到新请求</text>
  <text x="500" y="120" class="node-sub">先判断工作边界，不急着选最高档</text>

  <polygon points="500,180 575,225 500,270 425,225" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="500" y="218" class="node-title">同一个可验收结果？</text>
  <text x="500" y="239" class="node-sub">交付物和完成标准都没变</text>

  <rect x="660" y="280" width="200" height="78" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.8"/>
  <text x="760" y="307" class="node-title">新建 Session</text>
  <text x="760" y="327" class="node-sub">附 6 项短交接包</text>
  <text x="760" y="344" class="node-sub">不要搬运整段原始日志</text>

  <polygon points="500,330 570,375 500,420 430,375" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="500" y="370" class="node-title">当前上下文占用？</text>
  <text x="500" y="389" class="node-sub">看本轮携带材料，不看累计 Token</text>

  <rect x="105" y="460" width="220" height="70" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="215" y="486" class="node-title">50%–70%</text>
  <text x="215" y="506" class="node-sub">先做检查点，再手动 Compact</text>

  <rect x="675" y="460" width="220" height="70" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.6"/>
  <text x="785" y="486" class="node-title">&gt; 70%</text>
  <text x="785" y="506" class="node-sub">优先 Compact 或新 Session</text>

  <rect x="390" y="495" width="220" height="90" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="500" y="522" class="node-title">&lt; 50%：正常继续</text>
  <text x="500" y="543" class="node-sub">限制文件、日志和验证范围</text>
  <text x="500" y="560" class="node-sub">自动 Compact 只是安全网</text>

  <polygon points="500,650 575,700 500,750 425,700" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="500" y="695" class="node-title">任务难度？</text>
  <text x="500" y="714" class="node-sub">用最低可稳定达标档位</text>

  <rect x="75" y="770" width="230" height="80" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.7"/>
  <text x="190" y="798" class="node-title">清晰、重复、机械</text>
  <text x="190" y="819" class="node-sub">简单模型 + Low</text>
  <text x="190" y="836" class="node-sub">提取 / 分类 / 格式转换</text>

  <rect x="385" y="770" width="230" height="80" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.7"/>
  <text x="500" y="798" class="node-title">日常编码与调试</text>
  <text x="500" y="819" class="node-sub">均衡模型 + Medium / High</text>
  <text x="500" y="836" class="node-sub">先写清完成标准</text>

  <rect x="695" y="770" width="230" height="80" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.7"/>
  <text x="810" y="798" class="node-title">模糊、跨域、高价值</text>
  <text x="810" y="819" class="node-sub">强模型 + High / XHigh</text>
  <text x="810" y="836" class="node-sub">Max 只留给最难单点</text>

  <rect x="365" y="885" width="270" height="70" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="500" y="912" class="node-title">执行合同 + 分层验证</text>
  <text x="500" y="933" class="node-sub">目标 / 范围 / 禁区 / 完成标准 / 预算</text>

  <rect x="350" y="1010" width="300" height="72" rx="36" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="500" y="1039" class="node-title">形成检查点并交付</text>
  <text x="500" y="1060" class="node-sub">完成、验证、风险、下一步分开写</text>

  <!-- Edge labels and legend -->
  <text x="520" y="303" fill="#34d399" class="edge-label">是</text>
  <text x="650" y="216" fill="#fb7185" class="edge-label">否</text>
  <text x="274" y="365" fill="#fbbf24" class="edge-label">50%–70%</text>
  <text x="694" y="365" fill="#fb7185" class="edge-label">&gt;70%</text>
  <text x="515" y="454" fill="#34d399" class="edge-label">&lt;50%</text>
  <text x="279" y="690" fill="#34d399" class="edge-label">低</text>
  <text x="513" y="765" fill="#22d3ee" class="edge-label">中</text>
  <text x="704" y="690" fill="#a78bfa" class="edge-label">高</text>

  <text x="34" y="35" class="title">Agent Session 决策流</text>
  <text x="34" y="55" class="subtitle">一个可验收结果一个 Session；50% / 70% 是主动管理上下文的工程操作线</text>
  <rect x="34" y="1108" width="932" height="30" rx="6" fill="rgba(30,41,59,0.75)" stroke="#334155"/>
  <text x="500" y="1128" fill="#94a3b8" font-size="10" text-anchor="middle">注意：百分比是本手册的保守操作线，不是 Codex 或 Pi 的厂商硬阈值。</text>
</svg>
