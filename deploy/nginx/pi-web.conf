# pi-web same-origin device gateway — Nginx server block
#
# Installed on the cloud server (121.43.113.236).
# Listens on 127.0.0.1:33042 only; Cloudflare or another TLS-terminating
# reverse proxy is expected to forward Host: pi.ai4child.asia here.
#
# Authentication is handled by Pi Web with a signed HttpOnly session cookie.
# Nginx must not use auth_basic: browser-native auth prompts are unreliable in
# installed iOS PWAs and can leave the app with no recoverable login surface.
# Provider credentials, sessions, and AgentSession state remain on each device.

# The control plane may be served by either compatible device. Main Mac remains
# primary while Linux is a hot fallback. This upstream is used only for the app
# shell, login, device directory, and device selection; execution/data requests
# never fail over silently to a different machine.
upstream pi_web_control {
    server 127.0.0.1:33041 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:33043 backup;
}

# The preference cookie is HttpOnly and can contain only configured ids. Any
# missing or unknown value fails safely to Main Mac.
map $cookie_pi_web_device $pi_web_backend {
    default    http://127.0.0.1:33041;
    mac-main   http://127.0.0.1:33041;
    linux-home http://127.0.0.1:33043;
}

map $cookie_pi_web_device $pi_web_device_id {
    default    mac-main;
    mac-main   mac-main;
    linux-home linux-home;
}

server {
    listen 127.0.0.1:33042;
    server_name pi.ai4child.asia;

    # pi-web supports project uploads up to 100 MiB and image prompts whose
    # base64 envelope is larger than the source bytes.
    client_max_body_size 150m;

    # App-owned login, device metadata, and selection form the JSON control
    # plane. They use a real upstream failover instead of following the selected
    # execution-device cookie. The trusted header lets /api/devices report the
    # selected logical device even when another device served the control call.
    location ~ ^/api/(?:auth/session|devices(?:/select)?)$ {
        proxy_pass http://pi_web_control;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Authorization "";
        proxy_set_header X-Pi-Web-Selected-Device $pi_web_device_id;

        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_intercept_errors on;
        error_page 502 504 = @pi_web_control_offline_api;

        add_header X-Pi-Web-Device $pi_web_device_id always;
        add_header X-Pi-Web-Device-Status control always;
    }

    # The application document and versioned assets use the same failover
    # control plane. If every device is offline, Nginx still owns the origin and
    # returns a useful local recovery page instead of Cloudflare's generic 502.
    location ~ ^(?:/$|/login$|/manifest\.webmanifest$|/sw\.js$|/offline\.html$|/favicon\.ico$|/_next/|/icons/) {
        proxy_pass http://pi_web_control;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Authorization "";
        proxy_set_header X-Pi-Web-Selected-Device $pi_web_device_id;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_intercept_errors on;
        error_page 502 504 = @pi_web_control_offline_page;
    }

    # --- SSE / streaming endpoints (no buffering) ---------------------------
    location ^~ /api/agent/ {
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1260s;
        proxy_send_timeout 1260s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Pi Web uses cookies; never forward unrelated Authorization headers.
        proxy_set_header Authorization "";
        add_header X-Accel-Buffering "no" always;

        add_header X-Pi-Web-Device $pi_web_device_id always;
        add_header X-Pi-Web-Device-Status online always;
        proxy_pass $pi_web_backend;
    }

    # --- Health probe (same no-buffer treatment for SSE safety) -------------
    location = /api/health {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Authorization "";

        proxy_intercept_errors on;
        error_page 502 504 = @pi_web_device_offline;

        add_header X-Pi-Web-Device $pi_web_device_id always;
        add_header X-Pi-Web-Device-Status online always;
        proxy_pass $pi_web_backend;
    }

    # --- All other API and page requests ------------------------------------
    location / {
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Authorization "";

        add_header X-Pi-Web-Device $pi_web_device_id always;
        add_header X-Pi-Web-Device-Status online always;
        proxy_pass $pi_web_backend;
    }

    # Selected execution devices never fail over silently: that could run an
    # Agent or mutate files on the wrong machine. Convert connection-level
    # gateway failures into a bounded machine-readable state for the UI.
    location @pi_web_device_offline {
        internal;
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Retry-After 5 always;
        add_header X-Pi-Web-Device $pi_web_device_id always;
        add_header X-Pi-Web-Device-Status offline always;
        return 503 "{\"error\":\"device_offline\",\"deviceId\":\"$pi_web_device_id\",\"message\":\"Selected device is offline\"}";
    }

    location @pi_web_control_offline_api {
        internal;
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Retry-After 5 always;
        add_header X-Pi-Web-Device-Status offline always;
        return 503 '{"error":"all_devices_offline","message":"Cloud gateway cannot currently reach any Pi Web device"}';
    }

    location @pi_web_control_offline_page {
        internal;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 5 always;
        add_header X-Pi-Web-Device-Status offline always;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi Web 设备暂时不可达</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#eee;font:16px system-ui}.card{max-width:34rem;margin:1.5rem;padding:1.5rem;border:1px solid #333;border-radius:1rem;background:#191919}h1{font-size:1.25rem}p{color:#aaa;line-height:1.6}button{padding:.7rem 1rem;border:0;border-radius:.7rem;font:inherit;cursor:pointer}</style><div class="card"><h1>云端暂时无法连接执行设备</h1><p>云端入口仍在工作，但目前无法通过设备隧道连接 Mac 或 Linux。设备本身可能仍在线；网络或隧道恢复后刷新即可，不需要清除 Cookie 或站点数据。</p><button onclick="location.reload()">重新检查</button></div></html>';
    }
}
