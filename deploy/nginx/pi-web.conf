# pi-web same-origin device gateway — Nginx server block
#
# Installed on the cloud server (121.43.113.236).
# Listens on 127.0.0.1:33042 only; Cloudflare or another TLS-terminating
# reverse proxy is expected to forward Host: pi.ai4child.asia here.
#
# Authentication is handled by Pi Web with a signed HttpOnly session cookie.
# Nginx must not use auth_basic: browser-native auth prompts are unreliable in
# installed iOS PWAs and can leave the app with no recoverable login surface.
# Provider credentials, sessions, and AgentSession state remain on each device.

# The preference cookie is HttpOnly and can contain only configured ids. Any
# missing or unknown value fails safely to Main Mac. The control endpoint stays
# on Main Mac so a user can switch back even when the selected device is down.
map $cookie_pi_web_device $pi_web_backend {
    default    http://127.0.0.1:33041;
    mac-main   http://127.0.0.1:33041;
    linux-home http://127.0.0.1:33043;
}

map $cookie_pi_web_device $pi_web_device_id {
    default    mac-main;
    mac-main   mac-main;
    linux-home linux-home;
}

server {
    listen 127.0.0.1:33042;
    server_name pi.ai4child.asia;

    # pi-web supports project uploads up to 100 MiB and image prompts whose
    # base64 envelope is larger than the source bytes.
    client_max_body_size 150m;

    # Device selection is the gateway control plane. Keep it reachable through
    # Main Mac even if the currently selected worker is unavailable.
    location = /api/devices/select {
        proxy_pass http://127.0.0.1:33041;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Authorization "";
    }

    # --- SSE / streaming endpoints (no buffering) ---------------------------
    location ^~ /api/agent/ {
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1260s;
        proxy_send_timeout 1260s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Pi Web uses cookies; never forward unrelated Authorization headers.
        proxy_set_header Authorization "";
        add_header X-Accel-Buffering "no" always;

        add_header X-Pi-Web-Device $pi_web_device_id always;
        proxy_pass $pi_web_backend;
    }

    # --- Health probe (same no-buffer treatment for SSE safety) -------------
    location = /api/health {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Authorization "";

        add_header X-Pi-Web-Device $pi_web_device_id always;
        proxy_pass $pi_web_backend;
    }

    # --- All other API and page requests ------------------------------------
    location / {
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Authorization "";

        add_header X-Pi-Web-Device $pi_web_device_id always;
        proxy_pass $pi_web_backend;
    }
}
