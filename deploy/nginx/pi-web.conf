# pi-web mobile relay — Nginx server block
#
# Installed on the cloud server (121.43.113.236).
# Listens on 127.0.0.1:33042 only; Cloudflare or another TLS-terminating
# reverse proxy is expected to forward Host: pi.ai4child.asia here.
#
# Basic Auth is the edge gate.  Provider credentials and pi AgentSession
# state remain on the local Mac.

server {
    listen 127.0.0.1:33042;
    server_name pi.ai4child.asia;

    # pi-web supports project uploads up to 100 MiB and image prompts whose
    # base64 envelope is larger than the source bytes.
    client_max_body_size 150m;

    auth_basic "pi-web private";
    auth_basic_user_file /etc/nginx/pi-web.htpasswd;

    # --- SSE / streaming endpoints (no buffering) ---------------------------
    location ^~ /api/agent/ {
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1260s;
        proxy_send_timeout 1260s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Strip the edge Basic Auth before it reaches the backend.
        proxy_set_header Authorization "";
        add_header X-Accel-Buffering "no" always;

        proxy_pass http://127.0.0.1:33041;
    }

    # --- Health probe (same no-buffer treatment for SSE safety) -------------
    location = /api/health {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Authorization "";

        proxy_pass http://127.0.0.1:33041;
    }

    # --- All other API and page requests ------------------------------------
    location / {
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Authorization "";

        proxy_pass http://127.0.0.1:33041;
    }
}
