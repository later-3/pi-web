<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 11px; }
    .panel-title { fill: #f8fafc; font-size: 16px; font-weight: 700; text-anchor: middle; }
    .metric { fill: #f8fafc; font-size: 24px; font-weight: 700; text-anchor: middle; }
    .detail { fill: #94a3b8; font-size: 10px; text-anchor: middle; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="38" y="42" class="title">推理强度 ≠ 上下文规模：两个独立变量</text>
  <text x="38" y="64" class="subtitle">真实案例：Codex Session 019fad42… 的最后一个简单元问题</text>

  <!-- Timeline arrow behind boxes -->
  <path d="M175 515 L825 515" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Panel masks and panels -->
  <rect x="55" y="100" width="410" height="330" rx="14" fill="#0f172a"/>
  <rect x="535" y="100" width="410" height="330" rx="14" fill="#0f172a"/>
  <rect x="55" y="100" width="410" height="330" rx="14" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1.8"/>
  <rect x="535" y="100" width="410" height="330" rx="14" fill="rgba(136,19,55,0.32)" stroke="#fb7185" stroke-width="1.8"/>

  <text x="260" y="137" class="panel-title">推理强度（Effort）</text>
  <text x="260" y="158" class="detail">这一轮允许模型想多深</text>
  <text x="740" y="137" class="panel-title">当前上下文（Context）</text>
  <text x="740" y="158" class="detail">这一轮实际带给模型多少材料</text>

  <!-- Reasoning gauge -->
  <circle cx="260" cy="245" r="80" fill="none" stroke="#312e81" stroke-width="18"/>
  <path d="M203 301 A80 80 0 1 1 317 301" fill="none" stroke="#a78bfa" stroke-width="18" stroke-linecap="round"/>
  <line x1="260" y1="245" x2="305" y2="191" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="245" r="8" fill="#f8fafc"/>
  <text x="260" y="348" class="metric">High</text>
  <text x="260" y="374" class="detail">推理输出 70 · 总输出 219</text>
  <text x="260" y="394" class="detail">没有调用工具 · 9.310 秒</text>

  <!-- Context bar -->
  <rect x="590" y="195" width="300" height="48" rx="24" fill="#1e293b" stroke="#475569"/>
  <rect x="590" y="195" width="245" height="48" rx="24" fill="rgba(136,19,55,0.75)" stroke="#fb7185"/>
  <line x1="800" y1="184" x2="800" y2="254" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="800" y="174" fill="#fbbf24" font-size="9" text-anchor="middle">70% 工程线</text>
  <text x="740" y="288" class="metric">81.82%</text>
  <text x="740" y="320" class="detail">输入 289,155 / 窗口 353,400</text>
  <text x="740" y="342" class="detail">其中缓存输入 283,392</text>
  <text x="740" y="374" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">High 不会清空历史输入</text>

  <!-- Result-boundary timeline -->
  <circle cx="175" cy="515" r="9" fill="#22d3ee"/>
  <circle cx="500" cy="515" r="9" fill="#fbbf24"/>
  <circle cx="825" cy="515" r="9" fill="#34d399"/>
  <text x="175" y="548" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Provider 配置完成</text>
  <text x="175" y="568" class="detail">原可验收结果已经完成</text>
  <text x="500" y="548" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">询问如何选 High</text>
  <text x="500" y="568" class="detail">新问题，却沿用 289K 旧材料</text>
  <text x="825" y="548" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">更优做法</text>
  <text x="825" y="568" class="detail">新 Session + Low / Medium</text>

  <rect x="55" y="596" width="890" height="32" rx="7" fill="rgba(30,41,59,0.75)" stroke="#334155"/>
  <text x="500" y="617" fill="#94a3b8" font-size="10" text-anchor="middle">可把它们想成两个旋钮：一个管推理深度，一个管携带材料；调整一个不会自动改变另一个。</text>
</svg>
