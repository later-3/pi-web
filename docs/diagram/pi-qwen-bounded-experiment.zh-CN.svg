<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 11px; }
    .panel-title { fill: #f8fafc; font-size: 15px; font-weight: 700; }
    .label { fill: #cbd5e1; font-size: 11px; }
    .value { fill: #f8fafc; font-size: 12px; font-weight: 700; }
    .detail { fill: #94a3b8; font-size: 9px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="38" y="42" class="title">Pi + Qwen 有界对照实验</text>
  <text x="38" y="64" class="subtitle">2026-07-29 · 每个条件重复 3 次 · 全部结果正确 · 数值为中位数</text>

  <!-- Panel backgrounds -->
  <rect x="38" y="96" width="924" height="250" rx="12" fill="rgba(30,41,59,0.55)" stroke="#334155"/>
  <rect x="38" y="370" width="924" height="270" rx="12" fill="rgba(30,41,59,0.55)" stroke="#334155"/>

  <text x="62" y="128" class="panel-title">实验 A：确定性算术 + 严格 JSON（无工具）</text>
  <text x="62" y="150" class="detail">观察：不输出推理内容的简单模型同样 3/3 正确；Qwen3.7 的 Low/High 不是两种可控推理强度。</text>

  <!-- A axis -->
  <line x1="270" y1="176" x2="820" y2="176" stroke="#475569"/>
  <line x1="270" y1="176" x2="270" y2="310" stroke="#475569"/>
  <text x="270" y="168" class="detail" text-anchor="middle">0s</text>
  <text x="395" y="168" class="detail" text-anchor="middle">2.5s</text>
  <text x="520" y="168" class="detail" text-anchor="middle">5s</text>
  <line x1="395" y1="176" x2="395" y2="310" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="520" y1="176" x2="520" y2="310" stroke="#334155" stroke-dasharray="4,4"/>

  <text x="62" y="211" class="label">Qwen3.7 Plus · Low</text>
  <rect x="270" y="192" width="184" height="26" rx="5" fill="rgba(6,78,59,0.65)" stroke="#34d399"/>
  <text x="466" y="210" class="value">3.68s</text>
  <text x="590" y="210" class="detail">输出 107 · 其中推理 91 · 正确 3/3</text>

  <text x="62" y="257" class="label">Qwen3.7 Plus · High</text>
  <rect x="270" y="238" width="210" height="26" rx="5" fill="rgba(76,29,149,0.65)" stroke="#a78bfa"/>
  <text x="492" y="256" class="value">4.19s</text>
  <text x="590" y="256" class="detail">输出 118 · 其中推理 102 · 正确 3/3</text>

  <text x="62" y="303" class="label">Qwen3 Coder Plus · Off</text>
  <rect x="270" y="284" width="102" height="26" rx="5" fill="rgba(8,51,68,0.65)" stroke="#22d3ee"/>
  <text x="384" y="302" class="value">2.03s</text>
  <text x="590" y="302" class="detail">输出 11 · 其中推理 0 · 正确 3/3</text>

  <text x="62" y="402" class="panel-title">实验 B：读取 package.json + AGENTS.md，提取 4 个事实（只读工具）</text>
  <text x="62" y="424" class="detail">观察：Provider 不支持 Low/High 推理级别；两者都只是开启 Thinking，差异包含随机波动。</text>

  <!-- B axis -->
  <line x1="270" y1="450" x2="820" y2="450" stroke="#475569"/>
  <line x1="270" y1="450" x2="270" y2="584" stroke="#475569"/>
  <text x="270" y="442" class="detail" text-anchor="middle">0s</text>
  <text x="420" y="442" class="detail" text-anchor="middle">5s</text>
  <text x="570" y="442" class="detail" text-anchor="middle">10s</text>
  <line x1="420" y1="450" x2="420" y2="584" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="570" y1="450" x2="570" y2="584" stroke="#334155" stroke-dasharray="4,4"/>

  <text x="62" y="485" class="label">Qwen3.7 Plus · Low</text>
  <rect x="270" y="466" width="227" height="26" rx="5" fill="rgba(6,78,59,0.65)" stroke="#34d399"/>
  <text x="509" y="484" class="value">7.55s</text>
  <text x="620" y="484" class="detail">输出 257 · 其中推理 155 · 正确 3/3</text>

  <text x="62" y="531" class="label">Qwen3.7 Plus · High</text>
  <rect x="270" y="512" width="224" height="26" rx="5" fill="rgba(76,29,149,0.65)" stroke="#a78bfa"/>
  <text x="506" y="530" class="value">7.45s</text>
  <text x="620" y="530" class="detail">输出 226 · 其中推理 124 · 正确 3/3</text>

  <text x="62" y="577" class="label">Qwen3 Coder Plus · Off</text>
  <rect x="270" y="558" width="117" height="26" rx="5" fill="rgba(8,51,68,0.65)" stroke="#22d3ee"/>
  <text x="399" y="576" class="value">3.89s</text>
  <text x="620" y="576" class="detail">输出 84 · 其中推理 0 · 正确 3/3</text>

  <!-- Takeaway -->
  <rect x="62" y="656" width="876" height="66" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="500" y="681" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">结论边界</text>
  <text x="500" y="702" fill="#cbd5e1" font-size="10" text-anchor="middle">这是本机两道有界任务的观察，不是通用排行榜；Qwen3.7 Low/High 不是有效推理强度对照，输入也受缓存波动影响。</text>
  <text x="38" y="744" class="detail">运行参数：--no-session；关闭扩展/技能/上下文文件；工具实验仅开放 read, grep, find, ls；金额配置为 0，故不推算真实价格。</text>
</svg>
